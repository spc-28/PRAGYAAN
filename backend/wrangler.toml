name             = "backend"
main             = "src/index.ts"
compatibility_date = "2025-01-01"

# ─── Non-sensitive configuration ──────────────────────────────────────────────
# Put non-secret values here. These are committed to version control.
# [vars]
# ENVIRONMENT = "production"

# ─── Secrets ──────────────────────────────────────────────────────────────────
# NEVER put secret values in this file. Store them with:
#
#   wrangler secret put DATABASE_URL
#   wrangler secret put JWT_SECRET
#   wrangler secret put GEMINI_API_KEY
#
# For local development, create a .dev.vars file (see .dev.vars.example).
# Wrangler automatically loads .dev.vars when running `wrangler dev`.
